[workspace]
members = ["apps/desktop", "crates/eventkit", "crates/ui", "crates/theme"]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0"
gpui-kit = "=0.7.0"
crumble-eventkit = { path = "crates/eventkit" }
crumble-theme = { path = "crates/theme" }
crumble-ui = { path = "crates/ui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
