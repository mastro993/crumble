[workspace]
members = ["apps/desktop", "crates/audio", "crates/calendar", "crates/db", "crates/eventkit", "crates/local-models", "crates/notes", "crates/notify", "crates/remote", "crates/store", "crates/summarize", "crates/sync", "crates/transcribe", "crates/ui", "crates/theme"]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-channel = "2.5"
chrono = "0.4.45"
# Dev-only: DST dates whose local midnight does not exist, for `local_midnight` tests.
chrono-tz = "0.10"
# `notes` has more than 16 columns since its Summary (ADR 0007).
diesel = { version = "2.3.14", default-features = false, features = ["sqlite", "32-column-tables"] }
diesel_migrations = { version = "2.3.2", default-features = false, features = ["sqlite"] }
dirs = "6.0"
gpui-kit = "=0.7.0"
# GPUI core for crates that hold entities but no components; the version gpui-kit pins.
gpui = { package = "gpui-pre", version = "=0.3.7" }
crumble-audio = { path = "crates/audio" }
crumble-calendar = { path = "crates/calendar" }
crumble-db = { path = "crates/db" }
crumble-eventkit = { path = "crates/eventkit" }
crumble-local-models = { path = "crates/local-models" }
crumble-notes = { path = "crates/notes" }
crumble-notify = { path = "crates/notify" }
crumble-remote = { path = "crates/remote" }
crumble-store = { path = "crates/store" }
crumble-summarize = { path = "crates/summarize" }
crumble-sync = { path = "crates/sync" }
crumble-transcribe = { path = "crates/transcribe" }
# Agent automation for `--features mcp` builds. The rev matches the `gpui-mcp` server it talks to.
gpui-mcp = { git = "https://github.com/themixednuts/gpui-mcp", rev = "9dda8e5cb49990261e3fdaa26abe38112d30dafb", default-features = false, features = ["gpui-pre"] }
crumble-theme = { path = "crates/theme" }
crumble-ui = { path = "crates/ui" }
uuid = { version = "1.28", features = ["v7"] }
# The objc2 family behind crumble-eventkit, crumble-audio and crumble-notify, kept on one
# version. Each crate turns on the features it calls.
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-audio-toolbox = { version = "0.3.2", default-features = false }
objc2-avf-audio = { version = "0.3.2", default-features = false }
objc2-core-audio = { version = "0.3.2", default-features = false }
objc2-core-audio-types = { version = "0.3.2", default-features = false }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-event-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-user-notifications = { version = "0.3.2", default-features = false }
# Pure-Rust WebRTC audio processing. crumble-audio runs AEC3's linear echo filter from
# sonora-aec3, with sonora's band split and high-pass filter and sonora-common-audio's resampler.
# Pinned exactly: echo/linear.rs relies on how their internals line up.
sonora = "=0.2.0"
sonora-aec3 = "=0.2.0"
sonora-common-audio = "=0.2.0"
# Summaries and Transcripts from remote Providers: a small blocking HTTP client, as jobs already
# run on a background thread (ADRs 0007 and 0008).
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Local Models (ADR 0010): the sha256 a download is checked against, and the free space it needs.
sha2 = "0.11"
fs4 = "1.1"
# Runs Local Models: transcribe.cpp on ggml with Metal (ADR 0010). Builds C++ with CMake.
transcribe-cpp = "0.4"
# API keys in the macOS Keychain (ADR 0007).
security-framework = "3.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# A split module is foo.rs plus foo/, never foo/mod.rs.
mod_module_files = "warn"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# gpui-mcp needs GPUI's automation hooks, so every build links its patched copy of gpui-pre.
# Cargo patches apply to the whole workspace; drop this once the hooks land upstream.
[patch.crates-io]
gpui-pre = { git = "https://github.com/themixednuts/gpui-mcp", rev = "9dda8e5cb49990261e3fdaa26abe38112d30dafb" }
