name: Sync Handy's model list

# Crumble's Local Models list is Handy's catalog.json, copied unchanged (ADR 0010). Each week this
# copies the one in Handy's latest release, when it changed, into one standing pull request for a
# person to review: the list decides which weights users download.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handy-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A fine-grained token for this repository with contents and pull requests write. A pull
      # request opened with GITHUB_TOKEN would not run CI, which runs the catalog test.
      GH_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN }}
      BRANCH: sync/handy-catalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CATALOG_SYNC_TOKEN }}

      - id: sync
        run: python3 scripts/sync-handy-catalog.py --summary "$RUNNER_TEMP/summary.md" >> "$GITHUB_OUTPUT"

      - if: steps.sync.outputs.changed == 'true'
        env:
          TAG: ${{ steps.sync.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add crates/local-models/handy
          git commit -m "Sync Handy's model list from $TAG"
          git push --force origin "$BRANCH"
          title="Sync Handy's model list from $TAG"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/summary.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/summary.md"
          fi
