name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  domain:
    name: Domain crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Crate boundaries
        run: python3 scripts/check-crate-boundaries.py
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p crumble-calendar -p crumble-store -p crumble-eventkit --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p crumble-calendar -p crumble-store -p crumble-eventkit --locked

  workspace:
    name: Workspace
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Crate boundaries
        run: python3 scripts/check-crate-boundaries.py
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
