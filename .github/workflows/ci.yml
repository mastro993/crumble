name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request cancels its superseded runs. Each push to main gets its own group, because a
# shared group would cancel a queued push run once another one queues behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # .cargo/config.toml targets macOS 26, and crumble-transcribe builds Swift against its SDK.
    # Pinned rather than macos-latest so a label move cannot change the OS or Xcode under us.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain rust-toolchain.toml pins, with clippy and rustfmt. rust-cache keys
      # its cache on every installed rustc, so this runs first and removes the image's stable,
      # whose updates would otherwise make pull requests miss main's cache.
      - run: rustup toolchain install && rustup toolchain uninstall stable

      # transcribe.cpp builds ggml's C++ with CMake (ADR 0010); install it if the image lacks it.
      - run: command -v cmake || brew install cmake

      - run: python3 scripts/check-crate-boundaries.py

      - run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves a cache; pull requests restore it, so they cannot evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test --workspace --locked
