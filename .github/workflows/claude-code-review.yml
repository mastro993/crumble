name: Claude Code Review

# The owner's PRs are reviewed on every push. A PR from anyone else is
# reviewed only when the owner adds the `claude-review` label, once per label.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  pull_request_target:
    types: [labeled]

jobs:
  claude-review:
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_target' &&
        github.event.label.name == 'claude-review' &&
        github.event.pull_request.author_association != 'OWNER')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # Under pull_request_target this checks out the base branch. Never check
      # out the PR head here: the job runs with the repository's secrets.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
