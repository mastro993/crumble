name: PR Agent

# PR-Agent describes, reviews, and suggests improvements on the owner's PRs
# when they are opened, reopened, or marked ready. On any PR, including one
# from someone else, the owner can comment /review, /describe, /improve, or
# /ask "..." to run a tool. Nobody else starts a run.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.author_association == 'OWNER') ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR-Agent reads the diff through the API and never checks out the code.
    # It writes only PR descriptions, comments, and reviews.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The action's own Dockerfile pulls a rolling tag, so pin the release
      # image by digest instead (v0.48.0, attested by The-PR-Agent/pr-agent).
      - name: Run PR Agent
        uses: docker://pragent/pr-agent@sha256:80edef71baa3df28c129d858d4b53784abfc14704c235efb32b6c461d5399a6d # 0.48.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          config.model: anthropic/claude-opus-5-5
          config.fallback_models: '["anthropic/claude-haiku-4-5-20251001"]'
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
