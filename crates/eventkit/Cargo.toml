[package]
name = "crumble-eventkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2 = { workspace = true, features = ["exception"] }
objc2-core-foundation.workspace = true
objc2-core-graphics = { workspace = true, features = ["std", "CGColor", "CGColorSpace"] }
objc2-event-kit = { workspace = true, features = [
    "std",
    "block2",
    "objc2-core-graphics",
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKParticipant",
    "EKSource",
    "EKTypes",
] }
objc2-foundation = { workspace = true, features = [
    "std",
    "block2",
    "NSArray",
    "NSDate",
    "NSEnumerator",
    "NSError",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSSet",
    "NSString",
    "NSURL",
] }

# Every EventKit call is `unsafe`, so this crate cannot take the workspace's `forbid`
# (see docs/adr/0001-read-only-events-via-eventkit.md). The other lints match the workspace.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# A split module is foo.rs plus foo/, never foo/mod.rs.
mod_module_files = "warn"
