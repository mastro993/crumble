[package]
name = "crumble-eventkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor", "CGColorSpace"] }
objc2-event-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-graphics",
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKParticipant",
    "EKSource",
    "EKTypes",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSDate",
    "NSEnumerator",
    "NSError",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSSet",
    "NSString",
    "NSURL",
] }

# Every EventKit call is `unsafe`, so this crate cannot take the workspace's `forbid`
# (see docs/adr/0001-read-only-events-via-eventkit.md). The other lints match the workspace.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
