[package]
name = "crumble-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = [
    "std",
    "AudioFile",
    "ExtendedAudioFile",
    "objc2-core-audio-types",
    "objc2-core-foundation",
] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-audio-types",
    "AVAudioApplication",
    "AVAudioEngine",
    "AVAudioFile",
    "AVAudioFormat",
    "AVAudioIONode",
    "AVAudioMixerNode",
    "AVAudioNode",
    "AVAudioPlayerNode",
    "AVAudioTime",
    "AVAudioTypes",
] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "AudioHardware",
    "HostTime",
    "objc2",
    "objc2-core-audio-types",
    "objc2-foundation",
] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFURL"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSDictionary",
    "NSObject",
    "NSString",
    "NSURL",
    "NSUUID",
    "NSValue",
] }

# Every Core Audio call is `unsafe`, so this crate cannot take the workspace's `forbid`
# (see docs/adr/0005-recording-with-a-process-tap.md). The other lints match the workspace.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
